# Config-only: enable Game Center + create leaderboards/achievements. Never submits a release.
name: Game Center config

on:
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize ASC key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            test -n "${!name}"
          done
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          key="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"
      - name: Configure Game Center
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 scripts/appstore_connect.py configure-game-center \
            --bundle-id com.cinderandcrown.trashstack
