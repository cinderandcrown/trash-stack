name: CI

on:
  pull_request:
  push:
    branches: [main, "cursor/**"]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: AppIcon md5 gate (bandit dumpster icon A)
        run: python3 scripts/check_appicon_md5.py
      - name: Script unit tests
        run: python3 -m unittest discover -s scripts -v

  gamecore-linux:
    name: GameCore (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Swift 6.2
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2 libncurses6 libcurl4 binutils
          curl -fsSL "https://download.swift.org/swift-6.2-release/ubuntu2404/swift-6.2-RELEASE/swift-6.2-RELEASE-ubuntu24.04.tar.gz" -o /tmp/swift.tgz
          sudo mkdir -p /opt/swift
          sudo tar -xzf /tmp/swift.tgz -C /opt/swift --strip-components=1
          echo /opt/swift/usr/bin >> "$GITHUB_PATH"
          arch="$(uname -m)"
          if [ ! -e "/usr/lib/${arch}-linux-gnu/libncurses.so.6" ] && [ -e "/usr/lib/${arch}-linux-gnu/libncursesw.so.6" ]; then
            sudo ln -sf libncursesw.so.6 "/usr/lib/${arch}-linux-gnu/libncurses.so.6"
          fi
      - name: swift --version
        run: swift --version
      - name: GameCore tests
        working-directory: Packages/GameCore
        run: swift test
      - name: Services tests
        working-directory: Packages/Services
        run: swift test
      - name: GameRender tests (Linux-safe symbols)
        working-directory: Packages/GameRender
        run: swift test

  build:
    name: Build and test (iPhone)
    # Magpie pattern: xcode-27 ships the iOS 26 SDK required by App Store Connect.
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          echo "Runner labels context: xcode-27"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          echo "ImageOS=${ImageOS:-unknown} RUNNER_NAME=${RUNNER_NAME:-unknown}"

      - name: Install XcodeGen + ffmpeg
        run: |
          brew install xcodegen ffmpeg
          command -v ffmpeg
          ffmpeg -version | head -1
          # Smoke pixel checks use stdlib PNG decode only (no Pillow / no second Python).
          python3 -c "import struct, zlib, sys; print('stdlib PNG OK', sys.version.split()[0])"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project TrashStack.xcodeproj \
            -scheme TrashStack \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM= \
          | tee xcodebuild.log \
          | xcbeautify --renderer github-actions || (tail -n 80 xcodebuild.log; exit 1)

      - name: Fail on TrashStack warnings/errors
        if: always()
        run: |
          [ -f xcodebuild.log ] || exit 0
          root="$PWD/"
          errs=$(grep -E "^${root}(TrashStack|TrashStackTests|Packages)/[^:]+:[0-9]+:[0-9]+: error:" xcodebuild.log | awk '!seen[$0]++' || true)
          warns=$(grep -E "^${root}(TrashStack|TrashStackTests|Packages)/[^:]+:[0-9]+:[0-9]+: warning:" xcodebuild.log | awk '!seen[$0]++' || true)
          echo "Errors:"; echo "$errs"
          echo "Warnings:"; echo "$warns"
          if [ -n "$errs" ] || [ -n "$warns" ]; then exit 1; fi

      - name: Unit tests
        id: tests
        timeout-minutes: 20
        run: |
          set -o pipefail
          # Prefer a non-Max Pro for calm/fit evidence (Dynamic Island). Create if missing.
          device="$(python3 scripts/pick_iphone_simulator.py \
            --prefer "iPhone 16 Pro" --prefer "iPhone 17 Pro" --prefer "iPhone 15 Pro" \
            --prefer "iPhone 18 Pro" --create --require-match)"
          echo "device=$device" >> "$GITHUB_OUTPUT"
          echo "Simulator: $device"
          # Pre-boot + readiness: avoids XCTest host "RPC timeout / never finished bootstrapping" flakes.
          xcrun simctl boot "$device" 2>/dev/null || true
          xcrun simctl bootstatus "$device" -b || true
          run_tests() {
            rm -rf TestResults.xcresult
            set +e
            # Skip UITests here — real-play step drives them under recordVideo.
            xcodebuild test-without-building \
              -project TrashStack.xcodeproj \
              -scheme TrashStack \
              -destination "platform=iOS Simulator,id=$device" \
              -derivedDataPath DerivedData \
              -resultBundlePath TestResults.xcresult \
              -parallel-testing-enabled NO \
              -skip-testing:TrashStackUITests \
              | tee xcodebuild-test.log \
              | xcbeautify --renderer github-actions
            local ec=${PIPESTATUS[0]}
            set -e
            return "$ec"
          }
          if ! run_tests; then
            # One retry after a clean sim bounce — bootstrap deadlocks are infra, not product asserts.
            if grep -Eqi 'bootstrapping|RPC timeout|Apparently deadlocked|DTServiceHubClient|Early unexpected exit' xcodebuild-test.log; then
              echo "Simulator bootstrap flake — bouncing device and retrying once"
              xcrun simctl shutdown "$device" 2>/dev/null || true
              sleep 2
              xcrun simctl boot "$device" 2>/dev/null || true
              xcrun simctl bootstatus "$device" -b || true
              run_tests || (tail -n 80 xcodebuild-test.log; exit 1)
            else
              tail -n 80 xcodebuild-test.log
              exit 1
            fi
          fi

      # Real New Game capture — hard gate. Demo/autoplay slideshow is not evidence.
      - name: Real-play recording (fresh New Game ≥60s)
        id: real_play
        timeout-minutes: 15
        env:
          DEVICE: ${{ steps.tests.outputs.device }}
        run: |
          set -euo pipefail
          app="$(find DerivedData/Build/Products -name 'TrashStack.app' -type d | head -1)"
          test -n "$app"
          mkdir -p smoke-artifacts
          chmod +x scripts/simulator_real_play.sh
          # Bounce sim so leftover smoke/shot defaults cannot stick.
          xcrun simctl terminate "$DEVICE" com.cinderandcrown.trashstack >/dev/null 2>&1 || true
          ./scripts/simulator_real_play.sh "$DEVICE" "$app" smoke-artifacts
          test -s smoke-artifacts/real-play.mp4
          sz=$(wc -c < smoke-artifacts/real-play.mp4 | tr -d ' ')
          if (( sz < 1000000 )); then
            echo "real-play.mp4 too small ($sz)" >&2
            exit 1
          fi
          ls -la smoke-artifacts/real-play.mp4
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "run_id=${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Upload real-play early
        if: always() && steps.real_play.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: real-play-evidence
          path: |
            smoke-artifacts/real-play.mp4
            smoke-artifacts/real-play-silent.mp4
          if-no-files-found: warn

      # TODO(smoke-flake): simulator_smoke is non-blocking until io/bootstatus flakes
      # are fixed. Keep uploading artifacts for Magpie/eyes. Unit tests still gate.
      # Known skips when red: late-mode shots (revive/base/shop/notif), bootstatus,
      # wall-clock launch flakes — do NOT empty-commit re-run CI to paper over these.
      - name: Simulator smoke Pro (screenshots + ~60s video)
        # GitHub step timeout (macOS runners lack GNU `timeout`).
        # scripts/simulator_smoke.sh uses per-command deadlines + an internal watchdog.
        id: smoke_pro
        timeout-minutes: 40
        continue-on-error: true
        env:
          DEVICE: ${{ steps.tests.outputs.device }}
        run: |
          set -euo pipefail
          app="$(find DerivedData/Build/Products -name 'TrashStack.app' -type d | head -1)"
          test -n "$app"
          mkdir -p smoke-artifacts
          # Preserve real-play if smoke overwrites the folder partially.
          keep_rp=""
          if [[ -s smoke-artifacts/real-play.mp4 ]]; then
            cp -f smoke-artifacts/real-play.mp4 /tmp/real-play-keep.mp4
            keep_rp=1
          fi
          # Calm+Fit path only — skip optional meta/marketing stills so SE create
          # still has host RAM after ~60s recordVideo.
          CALM_FIT_ONLY=1 ./scripts/simulator_smoke.sh "$DEVICE" "$app" smoke-artifacts
          if [[ -n "$keep_rp" && -s /tmp/real-play-keep.mp4 ]]; then
            cp -f /tmp/real-play-keep.mp4 smoke-artifacts/real-play.mp4
          fi
          test -s smoke-artifacts/real-play.mp4
          test -s smoke-artifacts/fit/pro-title.png
          test -s smoke-artifacts/fit/pro-play.png
          test -s smoke-artifacts/fit/pro-game-over.png

      - name: Pro fit shots fallback (if full smoke missed aliases)
        if: always() && steps.smoke_pro.outcome != 'skipped'
        timeout-minutes: 10
        continue-on-error: true
        env:
          DEVICE: ${{ steps.tests.outputs.device }}
        run: |
          set -euo pipefail
          app="$(find DerivedData/Build/Products -name 'TrashStack.app' -type d | head -1)"
          test -n "$app"
          mkdir -p smoke-artifacts/fit
          # Reject bare-board "GO" leftovers — require real overlay assert before skipping.
          go_ok=0
          if [[ -s smoke-artifacts/fit/pro-game-over.png ]] \
            && python3 scripts/assert_fit_game_over.py smoke-artifacts/fit/pro-game-over.png; then
            go_ok=1
          fi
          if [[ -s smoke-artifacts/fit/pro-title.png && -s smoke-artifacts/fit/pro-play.png && "$go_ok" == "1" ]]; then
            echo "Pro fit aliases already present (GO overlay OK)"
            ls -la smoke-artifacts/fit/pro-*.png
            exit 0
          fi
          echo "Full smoke missed Pro fit aliases — reboot + screenshot-only pass"
          # Keep smoke board stills; only replace missing/bad fit aliases.
          keep_play=0
          if [[ -s smoke-artifacts/fit/pro-play.png ]] \
            && ! python3 scripts/assert_fit_game_over.py smoke-artifacts/fit/pro-play.png >/dev/null 2>&1; then
            keep_play=1
            cp -f smoke-artifacts/fit/pro-play.png /tmp/pro-play-keep.png
          elif [[ -s smoke-artifacts/03-compactor-clear.png ]]; then
            keep_play=1
            cp -f smoke-artifacts/03-compactor-clear.png /tmp/pro-play-keep.png
          elif [[ -s smoke-artifacts/02-gameplay.png ]]; then
            keep_play=1
            cp -f smoke-artifacts/02-gameplay.png /tmp/pro-play-keep.png
          fi
          rm -f smoke-artifacts/fit/pro-game-over.png
          xcrun simctl terminate "$DEVICE" com.cinderandcrown.trashstack >/dev/null 2>&1 || true
          xcrun simctl shutdown "$DEVICE" >/dev/null 2>&1 || true
          xcrun simctl boot "$DEVICE" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$DEVICE" -b >/tmp/pro-fit-boot.log 2>&1 || true
          chmod +x scripts/simulator_fit_shots.sh
          ./scripts/simulator_fit_shots.sh "$DEVICE" "$app" smoke-artifacts pro
          if (( keep_play == 1 )) && [[ -s /tmp/pro-play-keep.png ]]; then
            cp -f /tmp/pro-play-keep.png smoke-artifacts/fit/pro-play.png
            echo "Restored fit/pro-play.png from smoke board still" >&2
          fi
          test -s smoke-artifacts/fit/pro-title.png
          test -s smoke-artifacts/fit/pro-play.png
          test -s smoke-artifacts/fit/pro-game-over.png
          python3 scripts/assert_fit_game_over.py smoke-artifacts/fit/pro-game-over.png

      # Upload Pro evidence BEFORE SE. Prior run: smoke+fit succeeded, then SE create
      # OOMed the runner and we lost every artifact (no upload ever ran).
      - name: Upload Pro smoke artifacts
        if: always() && steps.smoke_pro.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: app-store-review-evidence-pro
          path: smoke-artifacts/
          if-no-files-found: warn

      - name: Simulator fit shots SE (title / play / game-over only)
        id: smoke_se
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -euo pipefail
          app="$(find DerivedData/Build/Products -name 'TrashStack.app' -type d | head -1)"
          test -n "$app"
          mkdir -p smoke-artifacts/fit
          # Free host memory before a second device — Pro + recordVideo leftovers
          # previously killed the runner during SE create (lost communication).
          pro="${{ steps.tests.outputs.device }}"
          xcrun simctl terminate "$pro" com.cinderandcrown.trashstack >/dev/null 2>&1 || true
          xcrun simctl shutdown "$pro" >/dev/null 2>&1 || true
          # Prefer an existing SE; only create if none match (generic iOS runtime).
          se="$(python3 scripts/pick_iphone_simulator.py \
            --prefer "iPhone SE (3rd generation)" --prefer "iPhone SE (3rd generation)" \
            --prefer "iPhone SE" --create --require-match)"
          echo "SE simulator: $se"
          if [[ "$se" == "$pro" ]]; then
            echo "SE UDID collided with Pro — refusing labeled SE evidence" >&2
            exit 1
          fi
          # Fresh boot before install — prior SE pass failed install on a stale/shutdown device.
          xcrun simctl boot "$se" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$se" -b >/tmp/se-boot.log 2>&1 || true
          chmod +x scripts/simulator_fit_shots.sh
          # Lean settle — SE is screenshot-only; keep wall clock under step budget.
          SHOT_DEADLINE_S=8 SIMCTL_DEADLINE_S=15 \
            ./scripts/simulator_fit_shots.sh "$se" "$app" smoke-artifacts se
          test -s smoke-artifacts/fit/se-title.png
          test -s smoke-artifacts/fit/se-play.png
          test -s smoke-artifacts/fit/se-game-over.png
          # Reject C&C splash labeled as title (too dark / no neon wordmark).
          python3 scripts/assert_fit_title.py smoke-artifacts/fit/se-title.png
          ls -la smoke-artifacts/fit/
          # Park SE so the final upload step is not fighting a live sim.
          xcrun simctl shutdown "$se" >/dev/null 2>&1 || true

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-review-evidence
          path: smoke-artifacts/
          if-no-files-found: warn

      # Hard gate AFTER upload so Magpie still gets partials, but the job stays red
      # until Pro+SE play / game-over / non-empty demo mp4 are all real.
      - name: Calm+Fit evidence gate
        if: always() && steps.smoke_pro.outcome != 'skipped'
        run: |
          set -euo pipefail
          fail=0
          need() {
            local p="$1"
            if [[ -s "$p" ]]; then
              echo "OK $p ($(wc -c < "$p") bytes)"
            else
              echo "MISSING $p" >&2
              fail=1
            fi
          }
          # Real-play is the Calm+Fit gate — demo slideshow is not evidence.
          need smoke-artifacts/real-play.mp4
          need smoke-artifacts/fit/pro-title.png
          need smoke-artifacts/fit/pro-play.png
          need smoke-artifacts/fit/pro-game-over.png
          need smoke-artifacts/fit/se-title.png
          need smoke-artifacts/fit/se-play.png
          need smoke-artifacts/fit/se-game-over.png
          if [[ ! -s smoke-artifacts/03-compactor-clear.png && ! -s smoke-artifacts/02-gameplay.png && ! -s smoke-artifacts/fit/pro-play.png ]]; then
            echo "MISSING board still (02/03 or fit/pro-play)" >&2
            fail=1
          fi
          if [[ -s smoke-artifacts/real-play.mp4 ]]; then
            sz=$(wc -c < smoke-artifacts/real-play.mp4 | tr -d ' ')
            if (( sz < 1000000 )); then
              echo "real-play.mp4 too small ($sz)" >&2
              fail=1
            fi
          fi
          if [[ -s smoke-artifacts/fit/pro-play.png ]]; then
            psz=$(wc -c < smoke-artifacts/fit/pro-play.png | tr -d ' ')
            if (( psz < 200000 )); then
              echo "fit/pro-play.png suspiciously small ($psz) — likely splash/grey" >&2
              fail=1
            fi
            # Reject GO modal mislabeled as play (prior tip had pro-play == pro-game-over).
            if python3 scripts/assert_fit_game_over.py smoke-artifacts/fit/pro-play.png >/dev/null 2>&1; then
              echo "fit/pro-play.png is a game-over overlay — not a play board" >&2
              # Prefer smoke board stills when available.
              if [[ -s smoke-artifacts/03-compactor-clear.png ]]; then
                cp -f smoke-artifacts/03-compactor-clear.png smoke-artifacts/fit/pro-play.png
                echo "Repaired fit/pro-play.png from 03-compactor-clear.png" >&2
              elif [[ -s smoke-artifacts/02-gameplay.png ]]; then
                cp -f smoke-artifacts/02-gameplay.png smoke-artifacts/fit/pro-play.png
                echo "Repaired fit/pro-play.png from 02-gameplay.png" >&2
              else
                fail=1
              fi
            fi
          fi
          # Pro + SE GO must be real overlays (panel + title + CTA).
          for go in smoke-artifacts/fit/pro-game-over.png smoke-artifacts/fit/se-game-over.png; do
            if [[ -s "$go" ]]; then
              python3 scripts/assert_fit_game_over.py "$go" || { echo "$go failed overlay assert" >&2; fail=1; }
            fi
          done
          # Play boards must NOT be overlays.
          for play in smoke-artifacts/fit/pro-play.png smoke-artifacts/fit/se-play.png; do
            if [[ -s "$play" ]] && python3 scripts/assert_fit_game_over.py "$play" >/dev/null 2>&1; then
              echo "$play looks like game-over, not play" >&2
              fail=1
            fi
          done
          if (( fail != 0 )); then
            echo "Calm+Fit evidence incomplete — refusing green" >&2
            ls -la smoke-artifacts/ smoke-artifacts/fit/ 2>/dev/null || true
            exit 1
          fi
          echo "Calm+Fit evidence gate passed"
          ls -la smoke-artifacts/fit/

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            xcodebuild.log
            xcodebuild-test.log
            TestResults.xcresult
            /tmp/real-play-xctest.log
            /tmp/real-play-mux.log
            smoke-artifacts/real-play.mp4
            smoke-artifacts/real-play-silent.mp4
          if-no-files-found: ignore
